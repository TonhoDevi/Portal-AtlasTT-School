spring:
  datasource:
    url: jdbc:postgresql://localhost:${POSTGRES_PORT:5432}/${POSTGRES_DB:clientes_db}
    username: ${POSTGRES_USER:clientes_user}
    password: ${POSTGRES_PASSWORD:troque_essa_senha}
